name: CI/CD Pipeline - Django CV Virtual

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name:  Testes & Integração Contínua (CI)
    runs-on: ubuntu-latest

    steps:
      - name:  Baixar código do repositório
        uses: actions/checkout@v4

      - name:  Configurar ambiente Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name:  Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name:  Checar integridade do Django
        run: |
          python manage.py check

      - name:  Executar testes unitários
        run: |
          python manage.py test

  build-docker:
    name:  Validação de Build do Container (CD)
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name:  Baixar código do repositório
        uses: actions/checkout@v4

      - name:  Testar Build da Imagem Docker
        run: |
          docker build -t curriculo-django:${{ github.sha }} .
