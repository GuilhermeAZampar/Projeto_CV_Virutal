{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Curriculo Guilherme Zampar</title>
    <link rel="stylesheet" href="{% static 'curriculo/css/style.css'  %}">
</head>
<body>
<header class="header">
   <div class="logo">
      SYSTEM://CURRICULO.GUILHERME.A.ZAMPAR
   </div>
    <nav class="navegacao">
        <a href="{%url 'home' %}">Home</a>

    {% if user.is_authenticated %}
    <div class="usuario">
        {{user.username}}
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
    </div>
    {% else %}
    <a href="{% url 'login' %}">Login</a>
    {% endif %}
    </nav>

</header>

<div class="container">
{% block content %}

{% endblock %}
</div>


<footer>
    Desenvolvido em Django
</footer>


</body>
</html>
